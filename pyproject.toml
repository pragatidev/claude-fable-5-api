[project]
name = "claude-fable-5-api"
version = "0.1.0"
description = "Companion repo for the Claude Fable 5 API Udemy course"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pragati Kunwer" }]
dependencies = [
  "anthropic>=0.60.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
